# Eureka refinement parameters
# Trainings per task = iteration * agent.sample + num_eval
iteration: 5    # how many refinement iterations to run
num_eval: 5   # times the best reward is re-trained to score it (the eval phase) default: 5, smoke-test: 1
base_seed: 42   # eval-phase seeds are base_seed + k + 1 (passed to each job as env SEED -> train.py --seed)
max_workers: 48
# Warm start: carry the previous iteration's winning checkpoint into the next
# iteration's jobs instead of starting from random weights (iteration 1 always
# cold-starts, since there is no previous winner yet).
#
# This is a *transfer*, not a resume: the reward function changes between
# iterations, so the settings below choose which parts of the checkpoint are
# still meaningful under the new reward. They are passed through to rl_games'
# config.warm_start block via scripts/train.py.
warm_start:
  enabled: false                 # --warm-start turns this on for one run (not written back)
  reset_optimizer: true          # drop the Adam moments and AMP scaler - they fit the old reward
  reset_lr_schedule: true        # drop last_lr / entropy_coef, restart from the config values
  reset_obs_normalizer: false    # keep observation statistics - the environment did not change
  reset_value_normalizer: true   # drop value statistics - the return scale follows the reward
  critic_warmup_epoch_count: 0   # critic-only epochs after transfer; not implemented, must be 0

# Eureka agent (LLM) settings
agent:
# qwen/qwen3-coder-30b-a3b-instruct
# deepseek/deepseek-v4-pro
# anthropic/claude-sonnet-4.5
  model: "qwen/qwen3-coder-30b-a3b-instruct"   #  "x-ai/grok-code-fast-1" # 'deepseek/deepseek-r1:free' # "anthropic/claude-3.7-sonnet:thinking"
  base_url: "https://openrouter.ai/api/v1"
  sample: 16        # reward candidates generated per iteration (the run phase) default: 16, smoke-test: 2
  temperature: 1.0  # LLM sampling temperature (raised for exploration variety)
  top_p: 0.95       # nucleus sampling; <1.0 widens the candidate distribution
  # Each candidate also gets a distinct sampler seed to diversify the batch beyond
  # what temperature/top_p alone provide.

# VLM Critic agent settings
vlm:
# qwen/qwen3-coder-30b-a3b-instruct
  # model: "qwen/qwen3-vl-30b-a3b-instruct"       # Image Input Model
  model: "google/gemini-3.6-flash"              # Video Input Model
  # model: "google/gemini-3.1-pro-preview"  # Video Input Model
  base_url: "https://openrouter.ai/api/v1"
  temperature: 0.3        # keep it low for critical evaluation, but not zero to avoid deterministic behavior
  max_output_tokens: 1200  # limit output length
  timeout_seconds: 90        # video clips are short so dont need too long
  frequency_penalty: 0.2    # Occassionally the vlm would repeat the same things over and over so this is to limit that

  prompt_file: "src/vlm/vlm_critic.txt"  # path to the prompt file for the VLM Critic agent

  logging:
    jsonl_enabled: true
    #jsonl_path_template: "./runs/{task_name}/{eval_id}/logs/rl_games/{robot_name}/{date_time}/training_record/vlm_feedback_{view_name}.jsonl"
    #debug_tokens: true  # log the token cost and if a response was truncated


