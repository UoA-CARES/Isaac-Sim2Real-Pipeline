# Eureka refinement parameters
# Trainings per task = iteration * agent.sample * repeats + num_eval
iteration: 5    # how many refinement iterations to run
repeats: 3      # RL trainings per candidate in the search phase, each on its own
                # seed. The candidate's fitness is their trimmed mean: the highest
                # and the lowest are discarded and the rest averaged, so at
                # repeats: 3 it is the middle run. This stops a single lucky
                # training from deciding the ranking. Cost is linear, and the
                # batch now submits agent.sample * repeats jobs at once, which
                # must stay under runner.hpc.max_active_jobs (default 50).
                # repeats: 1 reproduces the old one-training-per-candidate loop.
num_eval: 5     # seeds the run's best reward is re-trained on, once, after the loop
survivors: 5    # top-N candidates kept as the next iteration's parents (half of
                # agent.sample). Each parent is improved in its own conversation
                # branch and gets an equal share of the batch, so the batch size
                # and training cost are unchanged. Parents stay in the running
                # against their own children, so the pool cannot regress.
                # survivors: 1 reproduces Eureka's greedy single-parent loop.
base_seed: 42   # eval-phase seeds are base_seed + k + 1 (passed to each job as env SEED -> train.py --seed)
max_workers: 48

# Eureka agent (LLM) settings
agent:
# qwen/qwen3-coder-30b-a3b-instruct
# deepseek/deepseek-v4-pro
# anthropic/claude-sonnet-4.5
  model: "qwen/qwen3-coder-30b-a3b-instruct"   #  "x-ai/grok-code-fast-1" # 'deepseek/deepseek-r1:free' # "anthropic/claude-3.7-sonnet:thinking"
  base_url: "https://openrouter.ai/api/v1"
  sample: 10        # reward candidates generated per iteration (the run phase)
  temperature: 1.0  # LLM sampling temperature (raised for exploration variety)
  top_p: 0.95       # nucleus sampling; <1.0 widens the candidate distribution
  # Each candidate also gets a distinct sampler seed to diversify the batch beyond
  # what temperature/top_p alone provide.
